 ['pack','行李清單','green',['護照、錢包及信用卡','手機、充電器、行動電源及轉接頭','薄長袖、可穿脫的保暖外套','摺疊傘或輕便雨衣','好走的止滑鞋與備用襪','個人藥品、盥洗用品及口罩','行李吊牌、隨身小包及購物袋']]
];
const storageKey='tokyo-aomori-2027-v1';
let state={checks:{},motion:false};
try {const saved=JSON.parse(localStorage.getItem(storageKey));if(saved && typeof saved==='object')state={checks:saved.checks??{},motion:saved.motion===true};} catch{}
function save(){try{localStorage.setItem(storageKey,JSON.stringify(state))}catch{}}
const lists=document.querySelector('#checklists');
lists.innerHTML=checklists.map(([key,title,tone,items])=>`<article class="card"><header class="todo-head ${tone}"><h3>${title}</h3><span id="progress-${key}" aria-live="polite"></span></header><div class="todo-body">${items.map((item,i)=>`<label class="todo"><input type="checkbox" data-key="${key}-${i}" ${state.checks[key+'-'+i]?'checked':''}><span>${item}</span></label>`).join('')}</div></article>`).join('');
function updateProgress(){
  checklists.forEach(([key,,,items])=>{document.querySelector('#progress-'+key).textContent=items.filter((_,i)=>state.checks[key+'-'+i]).length+' / '+items.length});
}
lists.addEventListener('change',event=>{
  if(!event.target.matches('input[data-key]'))return;
  state.checks[event.target.dataset.key]=event.target.checked;
  save();updateProgress();
});
updateProgress();
const motion=document.querySelector('#motion');
function applyMotion(){document.documentElement.dataset.motion=state.motion?'off':'auto';motion.setAttribute('aria-pressed',state.motion);}
motion.addEventListener('click',()=>{state.motion=!state.motion;applyMotion();save()});
applyMotion();
const departure=Date.parse('2027-05-08T06:35:00+08:00');
function countdown(){
  const remaining=departure-Date.now();
  if(remaining<=0){document.querySelector('#count-label').textContent='旅程已出發';document.querySelector('#count').hidden=true;return}
  const mins=Math.ceil(remaining/60000);
  document.querySelector('#days').textContent=Math.floor(mins/1440);
  document.querySelector('#hours').textContent=String(Math.floor(mins%1440/60)).padStart(2,'0');
  document.querySelector('#minutes').textContent=String(mins%60).padStart(2,'0');
}
countdown();setInterval(countdown,15000);
</script>
</body>
